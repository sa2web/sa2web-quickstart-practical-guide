<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405"><style>.title{font:700 28px Arial,"Microsoft YaHei",sans-serif;fill:#17191d}.sub{font:16px Arial,"Microsoft YaHei",sans-serif;fill:#66707b}.head{font:700 18px Arial,"Microsoft YaHei",sans-serif;fill:#30343a}.item{font:15px Arial,"Microsoft YaHei",sans-serif;fill:#30343a}</style><rect width="1000" height="405" rx="26" fill="#fff"/><text x="50" y="50" class="title">Target URL Protection</text><text x="50" y="80" class="sub">Encrypted URL hides the origin address shown in the user frontend</text><text x="265" y="130" text-anchor="middle" class="head">No Protection</text><text x="735" y="130" text-anchor="middle" class="head">Encrypted URL Enabled</text><line x1="500" y1="115" x2="500" y2="380" stroke="#e6e8ec"/><rect x="70" y="165" width="390" height="54" rx="12" fill="#f7f8fa" stroke="#e2e5e9"/><text x="265" y="199" text-anchor="middle" class="item">User Frontend</text><rect x="70" y="235" width="390" height="54" rx="12" fill="#f7f8fa" stroke="#e2e5e9"/><text x="265" y="269" text-anchor="middle" class="item">Real Origin URL Visible</text><rect x="70" y="305" width="390" height="54" rx="12" fill="#f7f8fa" stroke="#e2e5e9"/><text x="265" y="339" text-anchor="middle" class="item">Access Target Site</text><rect x="540" y="165" width="390" height="54" rx="12" fill="#fff1f2" stroke="#f1c5ca"/><text x="735" y="199" text-anchor="middle" class="item">User Frontend</text><rect x="540" y="235" width="390" height="54" rx="12" fill="#fff1f2" stroke="#f1c5ca"/><text x="735" y="269" text-anchor="middle" class="item">Sa2web Encrypted Access Path</text><rect x="540" y="305" width="390" height="54" rx="12" fill="#fff1f2" stroke="#f1c5ca"/><text x="735" y="339" text-anchor="middle" class="item">Real Origin URL Stays in Configuration</text></svg>