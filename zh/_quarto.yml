project:
  type: book
  output-dir: _book

book:
  title: "Sa2web 快速入门与实战指南"
  subtitle: "从私有部署到团队协作，构建企业自己的云端浏览器环境"
  author: "Alex Mercer"
  date: today
  cover-image: images/cover.png
  favicon: images/favicon.svg
  site-url: "https://www.sa2web.com/"
  search: true
  page-navigation: true
  chapters:
    - index.qmd
    - part: "Part 1｜Sa2web 入门"
      chapters:
        - chapters/01-install-deploy.qmd
        - chapters/02-cloud-browser.qmd
        - chapters/03-saas-browser.qmd
        - chapters/04-collaboration.qmd
        - chapters/05-multi-account.qmd
        - chapters/06-inner-sites.qmd
        - chapters/07-users-permissions.qmd
    - part: "Part 2｜Sa2web 进阶"
      chapters:
        - chapters/08-target-url-protection.qmd
        - chapters/09-watermark.qmd
        - chapters/10-record-replay.qmd
        - chapters/11-mcp.qmd
        - chapters/12-sites-inner-sites-config.qmd
        - chapters/13-site-customization.qmd
    - part: "Part 3｜附录"
      chapters:
        - chapters/14-script-api.qmd
        - chapters/15-passkey.qmd
        - chapters/a-troubleshooting.qmd
        - chapters/b-glossary.qmd

format:
  html:
    theme:
      light: [cosmo, styles/sa2web.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    smooth-scroll: true
  pdf:
    documentclass: scrbook
    pdf-engine: xelatex
    include-in-header: styles/preamble.tex
    toc: true
    number-sections: true
    #fig-pos: 'H'
    header-includes: |
      \usepackage{graphicx}
      \usepackage{eso-pic}
      
      % 在文档开头（第一页）添加占满页面的封面图
      \AtBeginDocument{
        \thispagestyle{empty} % 第一页不显示页码/页眉
        \AddToShipoutPictureBG*{%
          \AtPageLowerLeft{%
            \includegraphics[width=\paperwidth, height=\paperheight]{images/cover.pdf}%
          }%
        }
        \null\newpage % 强行产生第一页空页（承载封面），随后进入正文或书名页
      }
    geometry:
      - top=22mm
      - bottom=24mm
      - left=22mm
      - right=22mm
  docx:
    toc: true
    number-sections: true
    filters:
      - filters/docx-layout.lua
  epub:
    toc: true
    number-sections: true
    css: styles/epub.css

lang: zh-CN
crossref:
  fig-title: "图"
  tbl-title: "表"
execute:
  freeze: auto
