<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405"><style>.title{font:700 28px Arial,"Microsoft YaHei",sans-serif;fill:#17191d}.sub{font:16px Arial,"Microsoft YaHei",sans-serif;fill:#66707b}.head{font:700 18px Arial,"Microsoft YaHei",sans-serif;fill:#30343a}.item{font:15px Arial,"Microsoft YaHei",sans-serif;fill:#30343a}</style><rect width="1000" height="405" rx="26" fill="#fff"/><text x="50" y="50" class="title">云浏览器最小工作流</text><text x="50" y="80" class="sub">先建立机器与浏览器实例，再由用户获得访问能力</text><text x="265" y="130" text-anchor="middle" class="head">管理端</text><text x="735" y="130" text-anchor="middle" class="head">用户端</text><line x1="500" y1="115" x2="500" y2="380" stroke="#e6e8ec"/><rect x="70" y="165" width="390" height="54" rx="12" fill="#f7f8fa" stroke="#e2e5e9"/><text x="265" y="199" text-anchor="middle" class="item">管理员</text><rect x="70" y="235" width="390" height="54" rx="12" fill="#f7f8fa" stroke="#e2e5e9"/><text x="265" y="269" text-anchor="middle" class="item">创建机器</text><rect x="70" y="305" width="390" height="54" rx="12" fill="#f7f8fa" stroke="#e2e5e9"/><text x="265" y="339" text-anchor="middle" class="item">创建浏览器实例</text><rect x="540" y="165" width="390" height="54" rx="12" fill="#fff1f2" stroke="#f1c5ca"/><text x="735" y="199" text-anchor="middle" class="item">普通用户</text><rect x="540" y="235" width="390" height="54" rx="12" fill="#fff1f2" stroke="#f1c5ca"/><text x="735" y="269" text-anchor="middle" class="item">登录用户前端</text><rect x="540" y="305" width="390" height="54" rx="12" fill="#fff1f2" stroke="#f1c5ca"/><text x="735" y="339" text-anchor="middle" class="item">打开云浏览器</text></svg>