<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405"><style>.title{font:700 28px Arial,"Microsoft YaHei",sans-serif;fill:#17191d}.sub{font:16px Arial,"Microsoft YaHei",sans-serif;fill:#66707b}.head{font:700 18px Arial,"Microsoft YaHei",sans-serif;fill:#30343a}.item{font:15px Arial,"Microsoft YaHei",sans-serif;fill:#30343a}</style><rect width="1000" height="405" rx="26" fill="#fff"/><text x="50" y="50" class="title">录制与回放</text><text x="50" y="80" class="sub">分组开启录制权限后，可从用户或管理员记录中进入回放</text><text x="265" y="130" text-anchor="middle" class="head">产生记录</text><text x="735" y="130" text-anchor="middle" class="head">查看记录</text><line x1="500" y1="115" x2="500" y2="380" stroke="#e6e8ec"/><rect x="70" y="165" width="390" height="54" rx="12" fill="#f7f8fa" stroke="#e2e5e9"/><text x="265" y="199" text-anchor="middle" class="item">目标分组</text><rect x="70" y="235" width="390" height="54" rx="12" fill="#f7f8fa" stroke="#e2e5e9"/><text x="265" y="269" text-anchor="middle" class="item">开启“录制回放”</text><rect x="70" y="305" width="390" height="54" rx="12" fill="#f7f8fa" stroke="#e2e5e9"/><text x="265" y="339" text-anchor="middle" class="item">用户开始浏览</text><rect x="540" y="165" width="390" height="54" rx="12" fill="#fff1f2" stroke="#f1c5ca"/><text x="735" y="199" text-anchor="middle" class="item">访问记录</text><rect x="540" y="235" width="390" height="54" rx="12" fill="#fff1f2" stroke="#f1c5ca"/><text x="735" y="269" text-anchor="middle" class="item">回放页面</text><rect x="540" y="305" width="390" height="54" rx="12" fill="#fff1f2" stroke="#f1c5ca"/><text x="735" y="339" text-anchor="middle" class="item">播放 / 暂停 / 进度控制</text></svg>