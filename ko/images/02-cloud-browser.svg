<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405"><style>.title{font:700 28px Arial,"Microsoft YaHei",sans-serif;fill:#17191d}.sub{font:16px Arial,"Microsoft YaHei",sans-serif;fill:#66707b}.head{font:700 18px Arial,"Microsoft YaHei",sans-serif;fill:#30343a}.item{font:15px Arial,"Microsoft YaHei",sans-serif;fill:#30343a}</style><rect width="1000" height="405" rx="26" fill="#fff"/><text x="50" y="50" class="title">Minimum Cloud Browser Workflow</text><text x="50" y="80" class="sub">Create machines and browser instances first, then grant users access</text><text x="265" y="130" text-anchor="middle" class="head">Admin Side</text><text x="735" y="130" text-anchor="middle" class="head">User Side</text><line x1="500" y1="115" x2="500" y2="380" stroke="#e6e8ec"/><rect x="70" y="165" width="390" height="54" rx="12" fill="#f7f8fa" stroke="#e2e5e9"/><text x="265" y="199" text-anchor="middle" class="item">Administrator</text><rect x="70" y="235" width="390" height="54" rx="12" fill="#f7f8fa" stroke="#e2e5e9"/><text x="265" y="269" text-anchor="middle" class="item">Create Machine</text><rect x="70" y="305" width="390" height="54" rx="12" fill="#f7f8fa" stroke="#e2e5e9"/><text x="265" y="339" text-anchor="middle" class="item">Create Browser Instance</text><rect x="540" y="165" width="390" height="54" rx="12" fill="#fff1f2" stroke="#f1c5ca"/><text x="735" y="199" text-anchor="middle" class="item">Normal User</text><rect x="540" y="235" width="390" height="54" rx="12" fill="#fff1f2" stroke="#f1c5ca"/><text x="735" y="269" text-anchor="middle" class="item">Log in to User Frontend</text><rect x="540" y="305" width="390" height="54" rx="12" fill="#fff1f2" stroke="#f1c5ca"/><text x="735" y="339" text-anchor="middle" class="item">Open Cloud Browser</text></svg>